[package]
name = "diffadvisor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri = { version = "2", features = [], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "diffadvisor_lib"
crate-type = ["lib"]

[[bin]]
name = "diffadvisor"
path = "src/main.rs"
required-features = ["tauri-app"]
