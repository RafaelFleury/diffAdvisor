[package]
name = "diffadvisor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
notify = "6"
serde_yaml = "0.9"
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "diffadvisor_lib"
crate-type = ["lib"]

[[bin]]
name = "diffadvisor"
path = "src/main.rs"
required-features = ["tauri-app"]

# Skip debug info for dependencies in dev builds: it is most of target/'s
# size, and stepping into Tauri or tokio internals is rarely needed.
[profile.dev.package."*"]
debug = false
